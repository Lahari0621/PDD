name: 🚀 Deploy & E2E Test — AI Debate Partner

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run Selenium E2E tests'
        required: false
        default: 'true'
        type: boolean
      test_suite:
        description: 'Test suite (all/auth/navigation/ui/regression)'
        required: false
        default: 'all'
        type: string

env:
  GITHUB_USERNAME: Lahari0621
  REPO_NAME: PDD
  BASE_URL: https://Lahari0621.github.io/PDD/
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

# ════════════════════════════════════════════════════════════════
# JOB 1 — BUILD + STATIC ANALYSIS + DEPLOY
# ════════════════════════════════════════════════════════════════
jobs:
  build-and-deploy:
    name: 🏗️ Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    outputs:
      deploy_status: ${{ steps.set-status.outputs.status }}

    steps:
      # Stage 1 — Checkout
      - name: 📥 Stage 1 — Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Stage 2 — Install Dependencies
      - name: 📦 Stage 2 — Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      # Stage 3 — Build
      - name: 🔨 Stage 3 — Build Application
        working-directory: frontend
        env:
          VITE_BASE_URL: /PDD/
          VITE_API_URL: ${{ secrets.VITE_API_URL || '' }}
          NODE_ENV: production
        run: |
          echo "Building with base=/PDD/"
          npm run build
          echo "✅ Build complete"
          ls -la dist/
          echo "--- dist/index.html first 5 lines ---"
          head -5 dist/index.html

      # Stage 4 — Static Analysis
      - name: 🔍 Stage 4 — Static Analysis (ESLint)
        working-directory: frontend
        run: |
          npm run lint -- --max-warnings=100 2>&1 || echo "⚠️  Lint warnings (non-blocking)"
          echo "✅ Static analysis complete"

      # Stage 5 — Deploy
      - name: 📋 Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: 🚀 Stage 5 — Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: ✅ Set Deploy Status
        id: set-status
        run: |
          echo "status=success" >> $GITHUB_OUTPUT
          echo "🚀 Deployed to: ${{ env.BASE_URL }}"

# ════════════════════════════════════════════════════════════════
# JOB 2 — VERIFY DEPLOYMENT
# ════════════════════════════════════════════════════════════════
  verify-deployment:
    name: 🔎 Stage 6-7 — Verify Live Deployment
    runs-on: ubuntu-latest
    needs: build-and-deploy
    outputs:
      verification_status: ${{ steps.verify.outputs.status }}

    steps:
      - name: ⏳ Stage 6 — Wait for GitHub Pages Propagation
        run: |
          echo "Waiting 90s for GitHub Pages CDN propagation..."
          sleep 90

      - name: 🔎 Stage 7 — Verify Deployment Availability
        id: verify
        run: |
          BASE_URL="${{ env.BASE_URL }}"
          MAX_RETRIES=15
          RETRY_DELAY=20
          SUCCESS=false

          for i in $(seq 1 $MAX_RETRIES); do
            echo "🔄 Attempt $i/$MAX_RETRIES → $BASE_URL"
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 15 --max-time 30 \
              -H "User-Agent: GitHub-Actions-Verifier/1.0" \
              "$BASE_URL" 2>/dev/null || echo "000")
            echo "   HTTP: $HTTP"
            if [ "$HTTP" = "200" ]; then
              SUCCESS=true
              echo "✅ Deployment verified (HTTP $HTTP)"
              break
            fi
            [ $i -lt $MAX_RETRIES ] && sleep $RETRY_DELAY
          done

          if [ "$SUCCESS" = "true" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed"  >> $GITHUB_OUTPUT
            echo "❌ Verification FAILED after $MAX_RETRIES attempts"
            exit 1
          fi

      - name: 🔬 Deployment Diagnostics
        if: always()
        run: |
          echo "=== DEPLOYMENT DIAGNOSTICS ==="
          BASE="${{ env.BASE_URL }}"
          echo "URL: $BASE"
          curl -s -o /dev/null -w "Status: %{http_code} | Size: %{size_download}B | Time: %{time_total}s\n" \
            --max-time 30 "$BASE" || echo "FAILED"
          echo "Content preview:"
          curl -s --max-time 20 "$BASE" 2>/dev/null | head -8 || echo "(no content)"
          echo "=============================="

# ════════════════════════════════════════════════════════════════
# JOB 3 — SELENIUM E2E TESTS + REPORTS + ARTIFACTS
# ════════════════════════════════════════════════════════════════
  selenium-tests:
    name: 🤖 Stage 8-13 — Selenium E2E Tests
    runs-on: ubuntu-latest
    needs: verify-deployment
    if: always() && needs.verify-deployment.outputs.verification_status == 'success'

    env:
      BASE_URL: https://Lahari0621.github.io/PDD/
      HEADLESS: 'true'
      IMPLICIT_WAIT: '10'
      EXPLICIT_WAIT: '20'
      PAGE_LOAD_TIMEOUT: '30'
      RETRY_COUNT: '2'
      SCREENSHOT_ON_FAILURE: 'true'
      REPORT_DIR: reports
      SCREENSHOT_DIR: screenshots
      LOG_DIR: logs
      TEST_SUITE: ${{ github.event.inputs.test_suite || 'all' }}

    defaults:
      run:
        working-directory: automation

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: automation/requirements.txt

      - name: 🌐 Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 📦 Stage 8 — Install Test Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ Dependencies installed"
          python -c "import selenium; print(f'Selenium {selenium.__version__}')"
          google-chrome --version

      - name: 📁 Create Directory Structure
        run: |
          python -c "
          import os
          dirs = [
            'pages','tests','utils','config','scripts','data','drivers','history',
            'reports/HTML','reports/Excel','reports/JSON',
            'reports/Screenshots','reports/Logs','reports/Summary',
            'screenshots/failures','screenshots/passed','logs'
          ]
          for d in dirs:
            os.makedirs(d, exist_ok=True)
          print('✅ Directories created')
          "

      - name: 📝 Write Framework Files
        run: python scripts/write_framework.py

      - name: 🔧 Setup Framework
        run: python scripts/setup_framework.py

      # Stage 8 — Run Tests
      - name: 🧪 Stage 8 — Execute Selenium E2E Tests
        id: run-tests
        timeout-minutes: 55
        run: |
          echo "🚀 Running against: $BASE_URL"
          python -m pytest tests/ \
            -v \
            --tb=short \
            --html=reports/HTML/execution-report.html \
            --self-contained-html \
            --junit-xml=reports/JSON/junit-results.xml \
            -n 2 \
            --reruns=2 \
            --reruns-delay=3 \
            --timeout=120 \
            2>&1 | tee logs/pytest-output.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "Test run exit code: $EXIT_CODE"
          # Don't fail the step — let pass/fail logic decide
          exit 0
        continue-on-error: true

      # Stage 9 — HTML Reports
      - name: 📊 Stage 9 — Generate HTML Reports
        if: always()
        run: |
          python scripts/generate_html_report.py
          echo "✅ HTML reports generated"

      # Stage 10 — Excel Reports
      - name: 📊 Stage 10 — Generate Excel Reports
        if: always()
        run: |
          python scripts/generate_excel_report.py
          echo "✅ Excel reports generated"

      - name: 📝 Generate Summary Markdown
        if: always()
        run: |
          python scripts/generate_summary.py > reports/Summary/summary.md
          cat reports/Summary/summary.md
          echo "✅ Summary markdown generated"

      # Stage 11 — Upload Artifacts
      - name: 📤 Stage 11 — Upload Automation_Test_Report.xlsx
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Automation_Test_Report
          path: automation/reports/Excel/Automation_Test_Report.xlsx
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload Failed_Test_Cases.xlsx
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Failed_Test_Cases
          path: automation/reports/Excel/Failed_Test_Cases.xlsx
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload Passed_Test_Cases.xlsx
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Passed_Test_Cases
          path: automation/reports/Excel/Passed_Test_Cases.xlsx
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload Summary_Report.xlsx
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Summary_Report
          path: automation/reports/Excel/Summary_Report.xlsx
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload HTML Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Reports
          path: |
            automation/reports/HTML/execution-report.html
            automation/reports/HTML/dashboard.html
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: automation/screenshots/
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Execution-Logs
          path: automation/logs/
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload JSON Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JSON-Results
          path: automation/reports/JSON/
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload Complete Evidence Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Complete-Test-Evidence-Run-${{ github.run_number }}
          path: |
            automation/reports/
            automation/screenshots/
            automation/logs/
          retention-days: 30
          if-no-files-found: warn

      # Stage 12 — Publish Summary
      - name: 📋 Stage 12 — Publish GitHub Actions Summary
        if: always()
        run: |
          python scripts/generate_summary.py >> $GITHUB_STEP_SUMMARY

      # Stage 13 — Historical Results
      - name: 📚 Stage 13 — Store Historical Results
        if: always()
        run: |
          mkdir -p history
          TIMESTAMP=$(date -u '+%Y%m%d_%H%M%S')
          python -c "
          import json, os
          from datetime import datetime, timezone
          record = {
            'run_id':     '${{ github.run_id }}',
            'run_number': '${{ github.run_number }}',
            'timestamp':  datetime.now(timezone.utc).isoformat(),
            'actor':      '${{ github.actor }}',
            'branch':     '${{ github.ref_name }}',
            'base_url':   'https://Lahari0621.github.io/PDD/',
            'commit':     '${{ github.sha }}'[:8],
          }
          path = f'history/run_{os.environ.get(\"TIMESTAMP\",\"unknown\")}.json'
          with open(path,'w') as f:
            json.dump(record, f, indent=2)
          print(f'✅ Historical record: {path}')
          " TIMESTAMP=$TIMESTAMP

      # Pass/Fail Logic
      - name: 🏁 Evaluate Pass/Fail Threshold
        if: always()
        run: |
          python -c "
          import json, os, sys
          path = 'reports/JSON/execution-results.json'
          if not os.path.exists(path):
            print('⚠️  No results JSON — treating as inconclusive')
            sys.exit(0)
          with open(path) as f:
            data = json.load(f)
          total   = data.get('total',0)
          passed  = data.get('passed',0)
          failed  = data.get('failed',0)
          rate    = round(passed/total*100,2) if total>0 else 0
          # Critical failures = tests with 'Critical' priority that failed
          results = data.get('results',[])
          critical_failed = sum(1 for r in results
            if r.get('status')=='FAILED' and r.get('priority')=='Critical')
          critical_total  = sum(1 for r in results if r.get('priority')=='Critical')
          critical_rate   = round(critical_failed/critical_total*100,2) if critical_total>0 else 0

          print(f'Total: {total} | Passed: {passed} | Failed: {failed}')
          print(f'Pass Rate: {rate}% | Critical Failed: {critical_failed} ({critical_rate}%)')
          print(f'Threshold: 95% overall | Critical: ≤5%')

          if rate < 95:
            print(f'❌ FAIL: Pass rate {rate}% < 95% threshold')
            sys.exit(1)
          if critical_rate > 5:
            print(f'❌ FAIL: {critical_rate}% of critical tests failed (>5%)')
            sys.exit(1)
          print(f'✅ PASS: {rate}% >= 95% threshold, critical failures {critical_rate}% <= 5%')
          "

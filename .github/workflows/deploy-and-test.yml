name: 🚀 Deploy & E2E Test — AI Debate Partner

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite (all/auth/navigation/ui/regression)'
        required: false
        default: 'all'
        type: string

env:
  BASE_URL: https://Lahari0621.github.io/PDD/
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

# ════════════════════════════════════════════════════════════════
# JOB 1 — BUILD + DEPLOY
# ════════════════════════════════════════════════════════════════
jobs:
  build-and-deploy:
    name: 🏗️ Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    outputs:
      deploy_status: ${{ steps.set-status.outputs.status }}

    steps:
      - name: 📥 Stage 1 — Checkout
        uses: actions/checkout@v4

      - name: 📦 Stage 2 — Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: 🔨 Stage 3 — Build Application
        working-directory: frontend
        env:
          VITE_BASE_URL: /PDD/
          NODE_ENV: production
        run: |
          npm run build
          echo "✅ Build complete"
          ls -la dist/

      - name: 🔍 Stage 4 — Static Analysis
        working-directory: frontend
        run: npm run lint -- --max-warnings=100 2>&1 || echo "⚠️ Lint warnings (non-blocking)"

      - name: 📋 Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: 🚀 Stage 5 — Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: ✅ Set Deploy Status
        id: set-status
        run: echo "status=success" >> $GITHUB_OUTPUT

# ════════════════════════════════════════════════════════════════
# JOB 2 — VERIFY DEPLOYMENT
# ════════════════════════════════════════════════════════════════
  verify-deployment:
    name: 🔎 Stage 6-7 — Verify Live Deployment
    runs-on: ubuntu-latest
    needs: build-and-deploy
    outputs:
      verification_status: ${{ steps.verify.outputs.status }}

    steps:
      - name: ⏳ Stage 6 — Wait for CDN Propagation
        run: |
          echo "Waiting 90s for GitHub Pages CDN propagation..."
          sleep 90

      - name: 🔎 Stage 7 — Verify HTTP 200
        id: verify
        run: |
          BASE_URL="${{ env.BASE_URL }}"
          MAX_RETRIES=15
          RETRY_DELAY=20
          SUCCESS=false
          for i in $(seq 1 $MAX_RETRIES); do
            echo "🔄 Attempt $i/$MAX_RETRIES → $BASE_URL"
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 15 --max-time 30 \
              -H "User-Agent: GitHub-Actions-Verifier/1.0" \
              "$BASE_URL" 2>/dev/null || echo "000")
            echo "   HTTP: $HTTP"
            if [ "$HTTP" = "200" ]; then
              SUCCESS=true
              echo "✅ Verified (HTTP $HTTP)"
              break
            fi
            [ $i -lt $MAX_RETRIES ] && sleep $RETRY_DELAY
          done
          if [ "$SUCCESS" = "true" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: 🔬 Deployment Diagnostics
        if: always()
        run: |
          echo "=== DIAGNOSTICS ==="
          curl -s -o /dev/null -w "Status: %{http_code} | Time: %{time_total}s\n" \
            --max-time 30 "${{ env.BASE_URL }}" || echo "FAILED"
          echo "==================="

# ════════════════════════════════════════════════════════════════
# JOB 3 — SELENIUM E2E TESTS
# ════════════════════════════════════════════════════════════════
  selenium-tests:
    name: 🤖 Stage 8-13 — Selenium E2E Tests
    runs-on: ubuntu-latest
    needs: verify-deployment
    if: always() && needs.verify-deployment.outputs.verification_status == 'success'

    env:
      BASE_URL:               https://Lahari0621.github.io/PDD/
      HEADLESS:               'true'
      IMPLICIT_WAIT:          '10'
      EXPLICIT_WAIT:          '20'
      PAGE_LOAD_TIMEOUT:      '30'
      SCREENSHOT_ON_FAILURE:  'true'
      REPORT_DIR:             reports
      SCREENSHOT_DIR:         screenshots
      LOG_DIR:                logs

    defaults:
      run:
        working-directory: automation

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ── Python 3.11 (pinned — avoids 3.13 compatibility issues) ──
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Chrome ────────────────────────────────────────────────
      - name: 🌐 Install Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      # ── Create ALL directories FIRST ──────────────────────────
      - name: 📁 Create Directory Structure
        run: |
          mkdir -p reports/HTML \
                   reports/Excel \
                   reports/JSON \
                   reports/Screenshots \
                   reports/Logs \
                   reports/Summary \
                   screenshots/failures \
                   screenshots/passed \
                   logs \
                   history \
                   pages tests utils config scripts data drivers
          echo "✅ Directories ready"
          ls -la

      # ── Stage 8: Install Python dependencies ─────────────────
      - name: 📦 Stage 8 — Install Test Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install each package individually so one failure is visible
          python -m pip install "selenium==4.18.1"
          python -m pip install "webdriver-manager==4.0.1"
          python -m pip install "pytest==7.4.4"
          python -m pip install "pytest-html==4.1.1"
          python -m pip install "pytest-xdist==3.5.0"
          python -m pip install "pytest-timeout==2.3.1"
          python -m pip install "openpyxl==3.1.2"
          python -m pip install "requests==2.31.0"
          python -m pip install "Pillow==10.2.0"
          python -m pip install "jinja2==3.1.3"
          echo "✅ All packages installed"
          python -c "import selenium; print('selenium', selenium.__version__)"
          python -c "import pytest;   print('pytest',   pytest.__version__)"
          python -c "import openpyxl; print('openpyxl', openpyxl.__version__)"

      # ── Write framework source files ──────────────────────────
      - name: 📝 Write Framework Files
        run: python scripts/write_framework.py

      # ── Run tests ─────────────────────────────────────────────
      - name: 🧪 Stage 8 — Execute Selenium E2E Tests
        id: run-tests
        timeout-minutes: 55
        run: |
          echo "🚀 Running 450 tests against: $BASE_URL"
          python -m pytest tests/ \
            -v \
            --tb=line \
            --html=reports/HTML/execution-report.html \
            --self-contained-html \
            --junit-xml=reports/JSON/junit-results.xml \
            -n 4 \
            --timeout=30 \
            2>&1 | tee logs/pytest-output.log || true
          echo "✅ Test execution complete"

      # ── Stage 9: HTML Reports ─────────────────────────────────
      - name: 📊 Stage 9 — Generate HTML Reports
        if: always()
        run: |
          python scripts/generate_html_report.py
          echo "✅ HTML reports generated"
          ls -la reports/HTML/

      # ── Stage 10: Excel Reports ───────────────────────────────
      - name: 📊 Stage 10 — Generate Excel Reports
        if: always()
        run: |
          python scripts/generate_excel_report.py
          echo "✅ Excel reports generated"
          ls -la reports/Excel/

      # ── Generate summary.md ───────────────────────────────────
      - name: 📝 Generate Summary Markdown
        if: always()
        run: |
          python scripts/generate_summary.py > reports/Summary/summary.md || true
          echo "✅ Summary generated"
          cat reports/Summary/summary.md || echo "(empty)"

      # ── Create placeholder files so artifacts always upload ───
      - name: 📋 Ensure Artifact Files Exist
        if: always()
        run: |
          # Screenshots placeholder
          touch screenshots/failures/.gitkeep
          touch screenshots/passed/.gitkeep
          # Logs placeholder
          [ -f logs/pytest-output.log ] || echo "No pytest output" > logs/pytest-output.log
          # JSON placeholder
          if [ ! -f reports/JSON/execution-results.json ]; then
            echo '{"total":0,"passed":0,"failed":0,"skipped":0,"results":[]}' \
              > reports/JSON/execution-results.json
          fi
          echo "✅ Placeholder files ensured"

      # ── Stage 11: Upload Artifacts ────────────────────────────
      - name: 📤 Upload Automation_Test_Report.xlsx
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Automation_Test_Report
          path: automation/reports/Excel/Automation_Test_Report.xlsx
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload Failed_Test_Cases.xlsx
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Failed_Test_Cases
          path: automation/reports/Excel/Failed_Test_Cases.xlsx
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload Passed_Test_Cases.xlsx
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Passed_Test_Cases
          path: automation/reports/Excel/Passed_Test_Cases.xlsx
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload Summary_Report.xlsx
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Summary_Report
          path: automation/reports/Excel/Summary_Report.xlsx
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload HTML Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Reports
          path: |
            automation/reports/HTML/
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: automation/screenshots/
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Execution-Logs
          path: automation/logs/
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload JSON Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JSON-Results
          path: automation/reports/JSON/
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload Complete Evidence Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Complete-Test-Evidence-Run-${{ github.run_number }}
          path: |
            automation/reports/
            automation/screenshots/
            automation/logs/
          retention-days: 30
          if-no-files-found: warn

      # ── Stage 12: Publish Summary ─────────────────────────────
      - name: 📋 Stage 12 — Publish GitHub Actions Summary
        if: always()
        run: python scripts/generate_summary.py >> $GITHUB_STEP_SUMMARY || true

      # ── Stage 13: Historical Record ───────────────────────────
      - name: 📚 Stage 13 — Store Historical Results
        if: always()
        run: |
          TIMESTAMP=$(date -u '+%Y%m%d_%H%M%S')
          cat > history/run_${TIMESTAMP}.json << EOF
          {
            "run_id":     "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "timestamp":  "$(date -u '+%Y-%m-%dT%H:%M:%SZ')",
            "actor":      "${{ github.actor }}",
            "branch":     "${{ github.ref_name }}",
            "commit":     "${{ github.sha }}",
            "base_url":   "https://Lahari0621.github.io/PDD/"
          }
          EOF
          echo "✅ Run ${{ github.run_number }} recorded"

      # ── Final status ──────────────────────────────────────────
      - name: 🏁 Final Status
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  PIPELINE COMPLETE — Run #${{ github.run_number }}"
          echo "  URL    : ${{ env.BASE_URL }}"
          echo "  Actor  : ${{ github.actor }}"
          echo "  Branch : ${{ github.ref_name }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "All artifacts uploaded — check Actions tab"
